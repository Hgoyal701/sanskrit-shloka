<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sanskrit Shloka Meaning" />
    <title>Sanskrit Shloka Meaning</title>
    <style>
      :root {
        --bg-color: #f9f3eb;
        --card-bg: #ffffff;
        --primary-color: #c75b20;
        --text-dark: #2b2b2b;
        --text-muted: #5e5e5e;
        --border-color: #eedcc9;
        --highlight-bg: #fff8f2;
        --shadow: rgba(0, 0, 0, 0.08);
      }

      [data-theme="dark"] {
        --bg-color: #121212;
        --card-bg: #1e1e1e;
        --primary-color: #ff9a57;
        --text-dark: #f1f1f1;
        --text-muted: #d1d1d1;
        --border-color: #3d3d3d;
        --highlight-bg: #261d19;
        --shadow: rgba(0, 0, 0, 0.3);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg-color);
        color: var(--text-dark);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 30px 20px;
        transition: background 0.3s ease, color 0.3s ease;
      }

      .wrapper {
        width: 100%;
        max-width: 760px;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }

      .theme-btn,
      .nav-btn {
        background: var(--card-bg);
        color: var(--text-dark);
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 10px 16px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: 0.2s ease;
      }

      .theme-btn:hover,
      .nav-btn:hover {
        border-color: var(--primary-color);
        color: var(--primary-color);
        transform: translateY(-1px);
      }

      .nav-btns {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .container {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 18px;
        padding: 35px 30px;
        box-shadow: 0 12px 30px var(--shadow);
      }

      .decorative-icon {
        text-align: center;
        font-size: 2.8rem;
        color: var(--primary-color);
        margin-bottom: 18px;
      }

      .shloka {
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        font-weight: 700;
        color: var(--primary-color);
        white-space: pre-line;
        line-height: 1.9;
        text-align: center;
        margin-bottom: 24px;
      }

      .section-title {
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-muted);
        margin-top: 26px;
        margin-bottom: 10px;
        text-align: center;
        font-weight: 600;
      }

      .section-title::after {
        content: "";
        display: block;
        width: 48px;
        height: 2px;
        background: var(--primary-color);
        margin: 8px auto 0;
        opacity: 0.6;
      }

      .transliteration {
        font-size: 1.05rem;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.8;
        margin-bottom: 10px;
      }

      .translation {
        font-size: 1.08rem;
        font-style: italic;
        text-align: center;
        color: var(--text-dark);
        margin-bottom: 18px;
        line-height: 1.8;
      }

      .meaning {
        background: var(--highlight-bg);
        border-left: 4px solid var(--primary-color);
        padding: 18px 20px;
        border-radius: 8px;
        text-align: justify;
        line-height: 1.8;
        color: var(--text-dark);
      }

      .source {
        text-align: center;
        margin-top: 24px;
        font-size: 0.92rem;
        color: var(--text-muted);
      }

      @media (max-width: 500px) {
        .container {
          padding: 24px 18px;
        }

        .controls {
          justify-content: center;
        }

        .nav-btns {
          justify-content: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div class="controls">
        <button class="theme-btn" id="themeToggle" aria-label="Toggle theme">🌓 Toggle Theme</button>

        <div class="nav-btns" aria-label="Verse navigation">
          <button class="nav-btn" onclick="showShloka(0)">Verse 1</button>
          <button class="nav-btn" onclick="showShloka(1)">Verse 2</button>
          <button class="nav-btn" onclick="showShloka(2)">Verse 3</button>
        </div>
      </div>

      <div class="container">
        <div class="decorative-icon">ॐ</div>

        <div class="shloka" id="shlokaText"></div>

        <div class="section-title">Transliteration</div>
        <div class="transliteration" id="transliterationText"></div>

        <div class="section-title">Literal Translation</div>
        <div class="translation" id="translationText"></div>

        <div class="section-title">Deeper Meaning</div>
        <div class="meaning" id="meaningText"></div>

        <div class="source" id="sourceText"></div>
      </div>
    </div>

    <script>
      if (!document.documentElement.getAttribute("data-theme")) {
        document.documentElement.setAttribute("data-theme", "light");
      }

      const shlokas = [
        {
          text: `कर्मण्येवाधिकारस्ते मा फलेषु कदाचन |
मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ||`,
          transliteration: `Karmanye vadhikaraste ma phaleshu kadachana |
Ma karma-phala-hetur bhur ma te sango 'stvakarmani ||`,
          translation: `You have the right to work, but never to the fruits of work. Do not let your motive be the fruits of action, nor should you be attached to inaction.`,
          meaning: `This verse from the Bhagavad Gita teaches the path of Karma Yoga. It reminds us to do our duty sincerely without being driven by greed, ego, fear, or anxiety about the outcome. The deeper lesson is selfless action with inner balance.`,
          source: `Bhagavad Gita, Chapter 2, Verse 47`
        },
        {
          text: `ॐ भूर्भुवः स्वः |
तत्सवितुर्वरेण्यं भर्गो देवस्य धीमहि |
धियो यो नः प्रचोदयात् ||`,
          transliteration: `Om bhur bhuvah svah |
Tat savitur varenyam bhargo devasya dhimahi |
Dhiyo yo nah prachodayat ||`,
          translation: `We meditate on the divine light of the Sun, the supreme source of wisdom and life. May it illuminate our intellect and guide us toward truth.`,
          meaning: `The Gayatri Mantra is a prayer for inner awakening and clarity of thought. It does not ask for material gains; instead, it invokes wisdom, discernment, and the purification of the mind.`,
          source: `Rigveda, Mandala 3, Sukta 62, Verse 10`
        },
        {
          text: `ॐ त्र्यम्बकं यजामहे सुगन्धिं पुष्टिवर्धनम् |
उर्वारुकमिव बन्धनान्मृत्योर्मुक्षीय माऽमृतात् ||`,
          transliteration: `Om tryambakam yajamahe sugandhim pushti-vardhanam |
Urvarukam iva bandhanan mrityor mukshiya mamritat ||`,
          translation: `We worship the three-eyed Lord, who nourishes and sustains all beings. May He liberate us from the bondage of death and grant us immortality and peace.`,
          meaning: `This is the Mahamrityunjaya Mantra, a prayer for protection, healing, and spiritual liberation. It asks for release from fear, ignorance, and attachment so one may live with wisdom and peace.`,
          source: `Rigveda and Yajurveda traditions`
        }
      ];

      function showShloka(index) {
        const data = shlokas[index];
        document.getElementById("shlokaText").textContent = data.text;
        document.getElementById("transliterationText").textContent = data.transliteration;
        document.getElementById("translationText").textContent = data.translation;
        document.getElementById("meaningText").textContent = data.meaning;
        document.getElementById("sourceText").textContent = data.source;
      }

      const themeToggle = document.getElementById("themeToggle");
      themeToggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", newTheme);
      });

      showShloka(0);
    </script>
  </body>
</html>
