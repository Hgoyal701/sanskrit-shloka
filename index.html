<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanskrit Shloka AI Meaning</title>
    <style>
      :root {
        --bg: #f9f3eb;
        --card: #ffffff;
        --primary: #c75b20;
        --text: #2b2b2b;
        --muted: #5e5e5e;
        --border: #eedcc9;
        --soft: #fff8f2;
      }

      [data-theme="dark"] {
        --bg: #121212;
        --card: #1e1e1e;
        --primary: #ff9a57;
        --text: #f1f1f1;
        --muted: #d1d1d1;
        --border: #3d3d3d;
        --soft: #261d19;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        padding: 24px;
      }

      .wrapper {
        width: 100%;
        max-width: 860px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }

      .heading {
        font-size: 1.4rem;
        font-weight: 700;
      }

      .subheading {
        color: var(--muted);
        font-size: 0.92rem;
        margin-top: 5px;
      }

      .theme-btn {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
      }

      textarea {
        width: 100%;
        min-height: 120px;
        border: 1px solid var(--border);
        background: rgba(0,0,0,0.02);
        border-radius: 12px;
        padding: 14px 16px;
        resize: vertical;
        font-size: 1rem;
        color: var(--text);
      }

      .actions {
        margin-top: 14px;
        display: flex;
        justify-content: flex-start;
      }

      .submit-btn {
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
      }

      .status {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .result-box {
        margin-top: 22px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--soft);
        padding: 18px 20px;
        white-space: pre-wrap;
        line-height: 1.75;
        display: none;
      }

      .result-box.visible {
        display: block;
      }

      .label {
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
      }
    </style>
  </head>

  <body>
    <div class="wrapper">
      <div class="card">
        <div class="topbar">
          <div>
            <div class="heading">Sanskrit Shloka AI Meaning</div>
            <div class="subheading">Paste or type a Sanskrit shloka and press Enter.</div>
          </div>
          <button class="theme-btn" id="themeToggle">🌓 Theme</button>
        </div>

        <form id="form">
          <textarea id="shlokaInput" placeholder="Type a Sanskrit shloka here..."></textarea>
          <div class="actions">
            <button type="submit" class="submit-btn">Interpret Meaning</button>
          </div>
        </form>

        <div class="status" id="status">Waiting for your shloka...</div>

        <div id="resultBox" class="result-box" aria-live="polite"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById("form");
      const textarea = document.getElementById("shlokaInput");
      const statusEl = document.getElementById("status");
      const resultBox = document.getElementById("resultBox");
      const themeToggle = document.getElementById("themeToggle");

      if (!document.documentElement.getAttribute("data-theme")) {
        document.documentElement.setAttribute("data-theme", "light");
      }

      themeToggle.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme");
        const next = current === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
      });

      textarea.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = textarea.value.trim();

        if (!text) {
          statusEl.textContent = "Please enter a shloka first.";
          return;
        }

        statusEl.textContent = "AI is reading the shloka...";
        resultBox.classList.remove("visible");
        resultBox.textContent = "";

        try {
          const response = await fetch("/api/interpret", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ shloka: text })
          });

          const data = await response.json();

          if (!response.ok) {
            statusEl.textContent = data.error || "Something went wrong.";
            return;
          }

          let output = "";

          if (data.result) {
            if (data.result.translation) {
              output += "Literal Translation:\n" + data.result.translation + "\n\n";
            }
            if (data.result.notes) {
              output += "Context / Notes:\n" + data.result.notes + "\n\n";
            }
            if (data.result.inner_meaning) {
              output += "Inner Meaning:\n" + data.result.inner_meaning + "\n\n";
            }
            if (data.result.takeaway) {
              output += "Practical Takeaway:\n" + data.result.takeaway;
            }
          } else if (data.text) {
            output = data.text;
          } else {
            output = JSON.stringify(data, null, 2);
          }

          resultBox.textContent = output;
          resultBox.classList.add("visible");
          statusEl.textContent = "Done.";
        } catch (error) {
          console.error(error);
          statusEl.textContent = "Network error. Please try again.";
        }
      });
    </script>
  </body>
</html>
