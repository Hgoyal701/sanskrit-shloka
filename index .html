<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Sanskrit Shloka Meaning — Live AI</title>
    <style>
      :root{--bg:#f9f3eb;--card:#fff;--primary:#c75b20;--text:#2b2b2b;--muted:#5e5e5e}
      [data-theme="dark"]{--bg:#121212;--card:#1e1e1e;--primary:#ff9a57;--text:#f1f1f1;--muted:#bdbdbd}
      *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,Segoe UI,Roboto;padding:28px;display:flex;justify-content:center}
      .card{width:100%;max-width:820px;background:var(--card);border-radius:14px;padding:28px;border:1px solid rgba(0,0,0,0.06)}
      .controls{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
      textarea{width:100%;min-height:96px;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:1rem;resize:vertical}
      .result{margin-top:14px;padding:14px;border-radius:10px;background:rgba(0,0,0,0.03);white-space:pre-wrap}
      .meta{font-size:0.9rem;color:var(--muted);margin-bottom:6px}
      button{padding:8px 12px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);background:transparent;cursor:pointer}
      .loading{opacity:0.6}
    </style>
  </head>
  <body>
    <div class="card" role="main">
      <div class="controls">
        <div>
          <div style="font-weight:700;font-size:1.2rem">Sanskrit Shloka — AI Inner Meaning</div>
          <div class="meta">Type or paste a shloka below and press Enter (Shift+Enter for newline). The AI will return a translation, notes and an inner meaning.</div>
        </div>
        <div>
          <button id="themeToggle" aria-label="Toggle theme">🌓 Theme</button>
        </div>
      </div>

      <form id="shlokaForm">
        <textarea id="shlokaInput" placeholder="Type or paste a shloka here..." aria-label="Shloka input"></textarea>
      </form>

      <div id="status" class="meta" aria-live="polite"></div>

      <div id="aiResult" class="result" hidden></div>
    </div>

    <script>
      // theme
      if (!document.documentElement.getAttribute('data-theme')) document.documentElement.setAttribute('data-theme','light');
      document.getElementById('themeToggle').addEventListener('click', () => {
        const cur = document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
      });

      const textarea = document.getElementById('shlokaInput');
      const form = document.getElementById('shlokaForm');
      const status = document.getElementById('status');
      const aiResult = document.getElementById('aiResult');

      // Submit on Enter (without Shift)
      textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          submitShloka();
        }
      });

      async function submitShloka() {
        const shloka = textarea.value.trim();
        if (!shloka) {
          status.textContent = 'Please enter a shloka to analyze.';
          return;
        }

        status.textContent = 'Analyzing... (this may take a few seconds)';
        aiResult.hidden = true;
        textarea.disabled = true;
        textarea.classList.add('loading');

        try {
          const resp = await fetch('/api/interpret', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ shloka })
          });

          const payload = await resp.json();

          if (!resp.ok) {
            status.textContent = payload?.error || `Server error: ${resp.status}`;
            return;
          }

          // If server returned structured JSON result, prefer that; otherwise display text
          if (payload.result && typeof payload.result === 'object') {
            const r = payload.result;
            let out = '';
            if (r.translation) out += '**Literal translation:**\n' + r.translation + '\n\n';
            if (r.notes) out += '**Context / notes:**\n' + r.notes + '\n\n';
            if (r.inner_meaning) out += '**Inner meaning:**\n' + r.inner_meaning + '\n\n';
            if (r.takeaway) out += '**Practical takeaway:**\n' + r.takeaway + '\n\n';
            // Plain text fallback for any extra
            if (r.raw) out += r.raw;
            aiResult.innerText = out.replace(/\*\*/g, ''); // remove simple markdown bold for display
          } else if (payload.text) {
            aiResult.innerText = payload.text;
          } else {
            aiResult.innerText = JSON.stringify(payload, null, 2);
          }

          aiResult.hidden = false;
          status.textContent = 'Done';
        } catch (err) {
          console.error(err);
          status.textContent = 'Network or server error. See console.';
        } finally {
          textarea.disabled = false;
          textarea.classList.remove('loading');
        }
      }
    </script>
  </body>
</html>
